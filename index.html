{id:"over",n:"Overview",h:"<h2>What is a conditional sentence?</h2><div class='grid'><div><p>A conditional sentence describes the result of a certain condition. The <b class='vi'>if-clause</b> (conditional clause) states the condition. The <b class='vm'>main clause</b> (result clause) states what follows from it. The order of clauses does not change the meaning.</p><div class='bd'><div class='i'><small>If-clause · condition</small>If you <b class='vi'>study</b> hard,</div><div class='ar' aria-hidden='true'>→</div><div class='m'><small>Main clause · result</small>you <b class='vm'>will pass</b>.</div></div><p>Reversed: “You will pass if you study hard.” When the if-clause comes first, a comma follows it. The patterns in this lesson are the standard basic patterns; other combinations exist.</p></div><div class='box'><h3>Two major categories</h3><p><b>Real conditionals</b> treat the condition as true or possible: the zero and first conditionals.</p><p><b>Unreal conditionals</b> treat the condition as imagined, unlikely, or contrary to fact: the second and third conditionals.</p></div></div>",nm:"Real Conditionals"},

{id:"cmp",n:"Compare",h:"<h2>Comparing the four types</h2><div class='scroll'><table><tr><th></th><th>Zero <span class='tag r'>Real</span></th><th>First <span class='tag r'>Real</span></th><th>Second <span class='tag u'>Unreal</span></th><th>Third <span class='tag u'>Unreal</span></th></tr><tr><th>Meaning and purpose</th><td>General truths and rules</td><td>Possible future result</td><td>Imagined or unlikely situation</td><td>Imagined past; regret or reflection</td></tr><tr><th>Time reference</th><td>Any time</td><td>Future</td><td>Present or future</td><td>Past</td></tr><tr><th>Basic structure</th><td>If + present simple, present simple</td><td>If + present simple, will + base verb</td><td>If + past simple, would + base verb</td><td>If + past perfect, would have + past participle</td></tr><tr><th>Example</th><td>If you heat ice, it melts.</td><td>If it rains, we will stay home.</td><td>If I had a car, I would drive.</td><td>If I had left earlier, I would have caught the bus.</td></tr></table></div><p style='color:var(--mute)'>Full explanations remain on each type’s own page; use the menu to revisit any of them.</p>"},
{id:"prac",n:"Practice",h:"<h2>Guided Practice</h2><p>Select an answer to reveal the explanation. Items move from identifying, to choosing forms, to correcting errors.</p><div id='pq'></div>"},
{id:"act",n:"Activity",h:"<h2>Application Activity</h2><p>Write your own sentence for each task, then compare with the sample. Reasonable alternatives are fine if the condition–result link makes sense and the grammar pattern matches the type.</p><div id='aq'></div>"},
{id:"assess",n:"Assessment",h:"<h2>Assessment</h2><p>Eight questions across all four types. Each question can be answered once.</p><div id='sq'></div><div id='res' class='box' hidden></div>"},
{id:"wrap",n:"Conclusion",h:"<h2>Conclusion</h2><div class='grid'><div class='box'><h3>Synthesis</h3><ul><li><b>Zero:</b> facts and regular results.</li><li><b>First:</b> possible future results.</li><li><b>Second:</b> imagined present or future situations.</li><li><b>Third:</b> imagined alternatives to the past.</li></ul></div><div class='box'><h3>Real vs. Unreal</h3><p><span class='tag r'>Real</span> The condition is true or possible; the verbs stay in the present (or use will).</p><p><span class='tag u'>Unreal</span> The condition is imagined or contrary to fact; the verbs move back: past simple for now or later, past perfect for the past.</p></div></div><div class='box'><h3>Why it matters</h3>“If I win, I will…” is hopeful; “If I won, I would…” is imagined; “If I had won, I would have…” is regret. Choosing the wrong form changes the meaning of what we say and write.</div><div class='box'><h3>Exit ticket</h3><p>Write one sentence about your own week using any conditional type, and name the type.</p><textarea aria-label='Exit ticket answer'></textarea></div><div class='box'><h3>References</h3><ul><li><a href='https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/conditionals-zero-first-second' target='_blank' rel='noopener noreferrer'>British Council LearnEnglish: Conditionals: zero, first and second</a></li><li><a href='https://dictionary.cambridge.org/grammar/british-grammar/conditionals-' target='_blank' rel='noopener noreferrer'>Cambridge Dictionary, English Grammar Today: Conditionals</a></li><li><a href='https://dictionary.cambridge.org/grammar/british-grammar/conditionals-if' target='_blank' rel='noopener noreferrer'>Cambridge Dictionary, English Grammar Today: Conditionals: if</a></li><li><a href='https://learnenglishteens.britishcouncil.org/grammar/b1-b2-grammar/third-conditional' target='_blank' rel='noopener noreferrer'>British Council LearnEnglish Teens: Third conditional</a></li></ul></div>"}];
