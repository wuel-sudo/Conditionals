{c:"u",q:"Correct the error: “If I would have time, I would join the club.”",o:["If I had time, I would join the club.","If I have time, I would join the club.","If I had had time, I will join the club."],a:0,e:"Second conditional: past simple in the if-clause, not “would”."},
{c:"u",q:"You regret skipping yesterday’s review. Which sentence fits?",o:["If I attend, I will pass.","If I attended, I would pass.","If I had attended, I would have understood the topic."],a:2,e:"Regret about the past calls for the third conditional."},
{c:"r",q:"“If you don’t water plants, they die.” differs from “If you don’t water the plant, it will die.” because the first…",o:["states a general truth, the second a specific possibility","is imagined, the second is real","refers to the past, the second to the present","has no difference in meaning"],a:0,e:"Zero conditionals state facts; first conditionals predict a specific possible result."}];
var AT=[
{c:"r",t:"Classroom rule (zero): write a sentence about what always happens when a rule is broken in class.",k:"Present simple in both clauses; a regular result."},
{c:"r",t:"Deadline (first): your paper is due Friday. Write what you will do if you finish early.",k:"Present simple in the if-clause; will + base verb."},
{c:"r",t:"Group project (first): what will your group do if one member is absent on presentation day?",k:"Possible future event; check that “will” is not in the if-clause."},
{c:"u",t:"Hypothetical (second): write about a change you would make to your school if you could.",k:"Past simple + would + base verb; the meaning is present/future, not past."},
{c:"u",t:"Transform (third): rewrite “I didn’t study, so I failed” to express regret.",k:"Past perfect + would (not) have + past participle."}];
/* ---------- builders ---------- */
var NOTE={zero:"“When” can often replace “if” with the same meaning: “When you heat ice, it melts.”",first:"Words such as unless, as long as, and as soon as can also introduce the condition in similar patterns.",second:"The past form signals unreality, not past time. “If I had more free time” is about now; “If we lived closer” could refer to any present or future moment. With “be”, “were” is traditional for all subjects (“If I were you”), though “was” is common in speech.",third:"Both clauses refer to an alternative past: the condition did not happen, so its result did not happen either. We often use this form to express regret or to complain."};
var TL={zero:[1,1,1],first:[0,1,1],second:[0,1,1],third:[1,0,0]};
var TLN={zero:"Real: true at any time",first:"Real: a possible future result",second:"Unreal: imagined, unlikely or impossible now or later",third:"Unreal: an imagined alternative to what happened"};
function tl(k){var n=["Past","Now","Future"],u=k==="second"||k==="third";return"<div class='tl"+(u?" un":"")+"' aria-hidden='true'>"+n.map(function(x,i){return"<span class='"+(TL[k][i]?"on":"")+"'>"+x+"</span>"}).join("")+"</div><small style='color:var(--mute)'>"+TLN[k]+"</small>"}
function typePage(k,cl){var t=T[k];return"<span class='banner "+cl+"'>"+(cl==="r"?"Real":"Unreal")+" Conditional</span><h2>"+t.n+"</h2><div class='grid'><div><div class='box'><h3>Meaning and purpose</h3>"+t.m+"</div><div class='box'><h3>When it is used</h3>"+t.w+"</div><div class='box'><h3>Basic structure</h3><div class='formula'>"+hl(t.f)+"</div><div class='bd'><div class='i'><small>If-clause · condition</small>"+hl(t.bd[0])+"<small style='margin-top:4px'>"+t.it+"</small></div><div class='ar' aria-hidden='true'>→</div><div class='m'><small>Main clause · result</small>"+hl(t.bd[1])+"<small style='margin-top:4px'>"+t.mt+"</small></div></div>"+tl(k)+"<p style='margin:8px 0 0;font-size:.95rem'><b>Note.</b> "+NOTE[k]+"</p></div></div><div><div class='box'><h3>Examples</h3><ul>"+t.ex.map(function(x){return"<li>"+hl(x)+"</li>"}).join("")+"</ul></div><div class='box'><h3>College life</h3>"+hl(t.col)+"</div><div class='box'><h3>Common error</h3><div class='bad'>✗ <s>"+t.bad+"</s><br>✓ "+t.good+"</div><small>"+t.why+"</small></div><div class='box'><h3>Quick check</h3><div id='ck-"+k+"'></div></div></div></div>"}
function ovCard(id,cl,n,d){return"<button class='opt-card "+cl+"' data-go='"+id+"'><b>"+n+"</b>"+d+" →</button>"}
var PG=[
{id:"home",n:"Wordle",h:"<h2>Wordle: Crack the Code</h2><div id='hm'></div>"},
{id:"objectives",n:"Objectives",h:"<span class='banner'>Learning Objectives</span><h2>At the end of the lesson, students should be able to:</h2><div class='box'><ol><li>identify the four types of conditional sentences;</li><li>differentiate the four types based on their meanings and uses; and</li><li>construct grammatically correct conditional sentences using the appropriate verb forms.</li></ol></div>"},
{id:"over",n:"Discussion",h:"<h2>What is a conditional sentence?</h2><div class='grid'><div><p>A conditional sentence describes the result of a certain condition. The <b class='vi'>if-clause</b> (conditional clause) states the condition. The <b class='vm'>main clause</b> (result clause) states what follows from it. The order of clauses does not change the meaning.</p><div class='bd'><div class='i'><small>If-clause · condition</small>If you <b class='vi'>study</b> hard,</div><div class='ar' aria-hidden='true'>→</div><div class='m'><small>Main clause · result</small>you <b class='vm'>will pass</b>.</div></div><p>Reversed: “You will pass if you study hard.” When the if-clause comes first, a comma follows it. The patterns in this lesson are the standard basic patterns; other combinations exist.</p></div><div class='box'><h3>Two major categories</h3><p><b>Real conditionals</b> treat the condition as true or possible: the zero and first conditionals.</p><p><b>Unreal conditionals</b> treat the condition as imagined, unlikely, or contrary to fact: the second and third conditionals.</p></div></div>",nm:"Real Conditionals"},
{id:"real",n:"Real",cl:"r",h:"<span class='banner r'>Real Conditionals</span><h2>True or possible situations</h2><p>In real conditionals, the condition is treated as true or possible. This section has two lessons. Choose one, or continue in order.</p><div class='grid'>"+ovCard("zero","","Zero Conditional","General truths, facts, and regular results")+ovCard("first","","First Conditional","Possible future situations and their likely results")+"</div>"},
{id:"zero",n:"Zero",cl:"r",h:typePage("zero","r")},
{id:"first",n:"First",cl:"r",h:typePage("first","r")},
{id:"unreal",n:"Unreal",cl:"u",h:"<span class='banner u'>Unreal Conditionals</span><h2>Imagined situations</h2><p>In unreal conditionals, the condition is imagined, unlikely, or contrary to fact. The verb form moves one step “back” to signal unreality. This section has two lessons.</p><div class='grid'>"+ovCard("second","u","Second Conditional","Imagined or unlikely present and future situations")+ovCard("third","u","Third Conditional","An imagined alternative to the past")+"</div>"},
{id:"second",n:"Second",cl:"u",h:typePage("second","u")},
{id:"third",n:"Third",cl:"u",h:typePage("third","u")},
{id:"cmp",n:"Compare",h:"<h2>Comparing the four types</h2><div class='scroll'><table><tr><th></th><th>Zero <span class='tag r'>Real</span></th><th>First <span class='tag r'>Real</span></th><th>Second <span class='tag u'>Unreal</span></th><th>Third <span class='tag u'>Unreal</span></th></tr><tr><th>Meaning and purpose</th><td>General truths and rules</td><td>Possible future result</td><td>Imagined or unlikely situation</td><td>Imagined past; regret or reflection</td></tr><tr><th>Time reference</th><td>Any time</td><td>Future</td><td>Present or future</td><td>Past</td></tr><tr><th>Basic structure</th><td>If + present simple, present simple</td><td>If + present simple, will + base verb</td><td>If + past simple, would + base verb</td><td>If + past perfect, would have + past participle</td></tr><tr><th>Example</th><td>If you heat ice, it melts.</td><td>If it rains, we will stay home.</td><td>If I had a car, I would drive.</td><td>If I had left earlier, I would have caught the bus.</td></tr></table></div>"},
{id:"prac",n:"Practice",h:"<h2>Guided Practice</h2><p>Select an answer to reveal the explanation. Items move from identifying, to choosing forms, to correcting errors.</p><div id='pq'></div>"},
{id:"act",n:"Activity",h:"<h2>Application Activity</h2><p>Write your own sentence for each task, then compare with the sample. Reasonable alternatives are fine if the condition–result link makes sense and the grammar pattern matches the type.</p><div id='aq'></div>"},
{id:"assess",n:"Assessment",h:"<h2>Assessment</h2><p>Eight questions across all four types. Each question can be answered once.</p><div id='sq'></div><div id='res' class='box' hidden></div>"},
{id:"wrap",n:"Conclusion",h:"<h2>Conclusion</h2><div class='grid'><div class='box'><h3>Synthesis</h3><ul><li><b>Zero:</b> facts and regular results.</li><li><b>First:</b> possible future results.</li><li><b>Second:</b> imagined present or future situations.</li><li><b>Third:</b> imagined alternatives to the past.</li></ul></div><div class='box'><h3>Real vs. Unreal</h3><p><span class='tag r'>Real</span> The condition is true or possible; the verbs stay in the present (or use will).</p><p><span class='tag u'>Unreal</span> The condition is imagined or contrary to fact; the verbs move back: past simple for now or later, past perfect for the past.</p></div></div><div class='box'><h3>Why it matters</h3>“If I win, I will…” is hopeful; “If I won, I would…” is imagined; “If I had won, I would have…” is regret. Choosing the wrong form changes the meaning of what we say and write.</div><div class='box'><h3>Exit ticket</h3><p>Write one sentence about your own week using any conditional type, and name the type.</p><textarea aria-label='Exit ticket answer'></textarea></div><div class='box'><h3>References</h3><ul><li><a href='https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/conditionals-zero-first-second' target='_blank' rel='noopener noreferrer'>British Council LearnEnglish: Conditionals: zero, first and second</a></li><li><a href='https://dictionary.cambridge.org/grammar/british-grammar/conditionals-' target='_blank' rel='noopener noreferrer'>Cambridge Dictionary, English Grammar Today: Conditionals</a></li><li><a href='https://dictionary.cambridge.org/grammar/british-grammar/conditionals-if' target='_blank' rel='noopener noreferrer'>Cambridge Dictionary, English Grammar Today: Conditionals: if</a></li><li><a href='https://learnenglishteens.britishcouncil.org/grammar/b1-b2-grammar/third-conditional' target='_blank' rel='noopener noreferrer'>British Council LearnEnglish Teens: Third conditional</a></li></ul></div>"}];
var pages=$("#pages"),nav=$("#nav"),N=PG.length,cur_i=0;
PG.forEach(function(p,i){var b=document.createElement("button");b.className=p.cl||"";b.dataset.id=p.id;b.textContent=p.n;b.onclick=function(){go(p.id)};nav.appendChild(b);
var s=document.createElement("section");s.id="pg-"+p.id;s.hidden=true;s.className="page "+(p.cl==="r"?"real":p.cl==="u"?"unreal":"");s.setAttribute("aria-label",p.n);
var nx=i<N-1?"<button class='btn "+(p.cl==="r"?"g":p.cl==="u"?"y":"")+"' data-go='"+PG[i+1].id+"'>"+(p.nm||"Next: "+PG[i+1].n)+" →</button>":"<button class='btn alt' data-go='home'>Back to Wordle</button>";
var pager=i===0?"":"<div class='pager'>"+(i>0?"<button class='btn alt' data-go='"+PG[i-1].id+"'>← Back</button>":"<span></span>")+nx+"</div>";
s.innerHTML=p.h+pager;pages.appendChild(s)});

function fitActivePage(){
  var active=Array.prototype.find.call(PG,function(p){return !$("#pg-"+p.id).hidden});
  if(!active)return;
  var page=$("#pg-"+active.id), mainEl=$("#pages");
  /* Keep text at full size. Short pages remain centered; long pages scroll naturally. */
  page.style.zoom="1";
  mainEl.scrollTop=0;
}

function go(id){nav.style.display=(id==="home"||id==="motivation")?"none":"flex";PG.forEach(function(p,i){var on=p.id===id;$("#pg-"+p.id).hidden=!on;if(on)cur_i=i});nav.querySelectorAll("button").forEach(function(b){if(b.dataset.id===id)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
$("#pfill").style.width=((cur_i+1)/N*100)+"%";$("#pbar").setAttribute("aria-valuenow",cur_i+1);$("#pinfo").textContent="Page "+(cur_i+1)+" of "+N+" · "+PG[cur_i].n;window.scrollTo(0,0);fitActivePage();requestAnimationFrame(function(){var pane=$("#pages");if(pane)pane.scrollTo({top:0,left:0,behavior:"auto"});});var hd=$("#pg-"+id+" h1,#pg-"+id+" h2");if(hd){hd.tabIndex=-1;hd.focus({preventScroll:true})}}
document.addEventListener("click",function(e){var g=e.target.closest("[data-go]");if(g)go(g.dataset.go)});
function toggleFullscreen(){
  if(!document.fullscreenElement){
    var target=document.documentElement;
    if(target.requestFullscreen){target.requestFullscreen().catch(function(){$("#msg").textContent="Use F11 if full screen is blocked by the browser.";});}
    else{$("#msg").textContent="Press F11 to enter full screen in your browser.";}
  }else if(document.exitFullscreen){document.exitFullscreen();}
}
$("#fullBtn").onclick=toggleFullscreen;
document.addEventListener("fullscreenchange",function(){
  $("#fullBtn").textContent=document.fullscreenElement?"⛶ Exit Full Screen":"⛶ Full Screen";
  $("#fullBtn").setAttribute("aria-label",document.fullscreenElement?"Exit full screen":"Enter full screen");
});
document.addEventListener("keydown",function(e){
  if(e.key==="F11"){e.preventDefault();toggleFullscreen();}
});
/* ---------- quiz engine ---------- */
function quiz(el,list,scored){var score=0,done=0;list.forEach(function(q,i){var d=document.createElement("div");d.className="box";d.innerHTML="<p>"+(q.c?tag(q.c):"")+"<b>"+(i+1)+".</b> "+q.q+"</p>";var fb=document.createElement("div"),ans=false;
q.o.forEach(function(o,j){var b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=function(){if(ans)return;ans=true;var ok=j===q.a;b.classList.add(ok?"ok":"no");d.querySelectorAll(".opt")[q.a].classList.add("ok");d.querySelectorAll(".opt").forEach(function(x){x.disabled=true});fb.className="fb";fb.textContent=(ok?"Correct. ":"Not quite. ")+q.e;if(ok)score++;done++;if(scored&&done===list.length)fin(score,list.length)};d.appendChild(b)});d.appendChild(fb);el.appendChild(d)})}
function fin(s,n){var r=$("#res");r.hidden=false;r.innerHTML="<h3>Score: "+s+" / "+n+"</h3><p>"+(s>=7?"Excellent: you can tell Real from Unreal and use all four types.":s>=5?"Good progress. Revisit the section for the types you missed.":"Review the Real and Unreal sections, then try again.")+"</p><button class='btn' id='rst'>Restart assessment</button>";$("#rst").onclick=function(){$("#sq").innerHTML="";r.hidden=true;quiz($("#sq"),AS,true);$("#sq").scrollIntoView()};r.scrollIntoView()}
Object.keys(T).forEach(function(k){quiz($("#ck-"+k),[T[k].c],false)});
quiz($("#pq"),PQ,false);quiz($("#sq"),AS,true);
AT.forEach(function(a,i){var d=document.createElement("div");d.className="box";d.innerHTML="<p>"+tag(a.c)+"<b>Task "+(i+1)+".</b> "+a.t+"</p><textarea aria-label='Answer for task "+(i+1)+"'></textarea><p><button class='btn alt'>Show sample answer</button></p><div class='fb' hidden><b>Sample:</b> "+a.s+"<br><b>Check:</b> "+a.k+" Your answer may differ if it shows a sensible condition and result in the right form.</div>";var b=d.querySelector("button"),f=d.querySelector(".fb");b.onclick=function(){f.hidden=false;b.hidden=true};$("#aq").appendChild(d)});
/* ---------- wordle ---------- */
$("#hm").innerHTML=$("#home").innerHTML;
var W=[{w:"CAUSE",h:"Hint: the reason something happens."},{w:"CHOSE",h:"Hint: the past form of “choose”."},{w:"MAYBE",h:"Hint: another way to say “perhaps”."}];
var wi=0,row=0,cur="",over=false,keys={};
function build(){var b=$("#board");b.innerHTML="";for(var r=0;r<6;r++){var d=document.createElement("div");d.className="row";for(var c=0;c<5;c++){var t=document.createElement("div");t.className="t";d.appendChild(t)}b.appendChild(d)}$("#hint").textContent="Word "+(wi+1)+" of "+W.length+" · "+W[wi].h;row=0;cur="";over=false;keys={};$("#msg").textContent="";$("#scn").hidden=true}
function paint(){var t=$("#board").children[row].children;for(var i=0;i<5;i++){t[i].textContent=cur[i]||"";t[i].className="t"+(cur[i]?" f":"")}}
function key(k){if(over)return;$("#msg").textContent="";if(k==="BACK"){cur=cur.slice(0,-1);paint()}else if(k==="ENTER"){if(cur.length<5){$("#msg").textContent="Not enough letters.";return}grade()}else if(cur.length<5){cur+=k;paint()}}
function grade(){var a=W[wi].w,res=["a","a","a","a","a"],left={},i;for(i=0;i<5;i++){if(cur[i]===a[i])res[i]="c";else left[a[i]]=(left[a[i]]||0)+1}for(i=0;i<5;i++){if(res[i]!=="c"&&left[cur[i]]>0){res[i]="p";left[cur[i]]--}}
var t=$("#board").children[row].children,rk={a:1,p:2,c:3};for(i=0;i<5;i++){t[i].className="t "+res[i];var l=cur[i];if(!keys[l]||rk[res[i]]>rk[keys[l]])keys[l]=res[i]}
if(cur===a){over=true;unlock()}else if(row===5){over=true;$("#msg").textContent="The word was "+a+".";unlock()}else{row++;cur=""}}
function unlock(){var s=$("#scn"),last=wi===W.length-1;s.hidden=false;s.innerHTML="<p><b>"+W[wi].w+"</b> — Correct!</p><button class='btn' id='nx'>"+(last?"View Objectives":"Next word")+"</button>";$("#nx").onclick=function(){if(last){go("objectives")}else{wi++;build()}}}
document.addEventListener("keydown",function(e){
  if($("#pg-home").hidden || e.target.tagName==="TEXTAREA" || e.target.tagName==="INPUT" ||
     e.target.isContentEditable || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if(e.key==="Enter"){
    if(e.target.tagName==="BUTTON") return;
    e.preventDefault(); key("ENTER");
  } else if(e.key==="Backspace"){
    e.preventDefault(); key("BACK");
  } else if(/^[a-zA-Z]$/.test(e.key)){
    e.preventDefault(); key(e.key.toUpperCase());
  }
}, true);

document.addEventListener("keydown", function(e) {
  if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
  var target = e.target;
  var tag = target && target.tagName ? target.tagName.toLowerCase() : "";
  if (tag === "input" || tag === "textarea" || tag === "select" ||
      (target && target.isContentEditable)) return;
  if (tag === "button" || tag === "a") {
    if (e.key === " " || e.key === "Enter") return;
  }
  if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    if (cur_i < N - 1) go(PG[cur_i + 1].id);
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    if (cur_i > 0) go(PG[cur_i - 1].id);
  }
}, true);

build();go("home");window.addEventListener("resize",fitActivePage);document.addEventListener("fullscreenchange",fitActivePage);
</script></body></html>
